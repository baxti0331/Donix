<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Реклама</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1115;--fg:#fff;--accent:#22c55e;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
.bar{position:absolute;top:calc(var(--st) + 56px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;z-index:6;pointer-events:none}
.tag{background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:5px 10px;border-radius:999px;backdrop-filter:blur(6px)}
.tools{display:flex;gap:8px;align-items:center;pointer-events:auto}
.btn{position:relative;width:38px;height:38px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);cursor:pointer}
.btn[hidden]{display:none}
#close{cursor:not-allowed}
#close svg{position:absolute;inset:0;transform:rotate(-90deg)}
#close circle{fill:none;stroke-width:3}
#close .trk{stroke:rgba(255,255,255,.25)}
#close .prg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
#close.ready{cursor:pointer;background:#fff;color:#000}
#close.ready svg{display:none}
#close span{position:relative;font-size:15px;font-weight:700}
.creative{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
.creative img,.creative video{width:100%;height:100%;object-fit:cover;display:block}
.creative.contain img,.creative.contain video{object-fit:contain}
.creative iframe{width:100%;height:100%;border:0;background:#fff}
.blur{position:absolute;inset:-20px;width:calc(100% + 40px)!important;height:calc(100% + 40px)!important;object-fit:cover;filter:blur(28px) brightness(.55)}
.fg{position:relative;z-index:1}
.shade{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(transparent,rgba(0,0,0,.82));z-index:2;pointer-events:none}
.info{position:absolute;left:16px;right:16px;bottom:calc(var(--sb) + 86px);z-index:3;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.info h2{margin:0 0 6px;font-size:22px;line-height:1.2}
.info p{margin:0;font-size:15px;opacity:.92;line-height:1.35}
.cta{position:absolute;left:16px;right:16px;bottom:calc(var(--sb) + 18px);z-index:4}
.cta button{display:block;width:100%;border:0;background:var(--accent);color:#06210f;font-weight:700;font-size:16px;padding:14px;border-radius:14px;cursor:pointer}
.pbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.2);z-index:5}
.pbar i{display:block;height:100%;width:0;background:var(--accent)}
.hint{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 70px);text-align:center;font-size:12px;color:rgba(255,255,255,.85);z-index:4;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}
.placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;gap:14px;background:linear-gradient(160deg,#312e81,#6d28d9 55%,#be185d)}
.placeholder h1{margin:0;font-size:28px;line-height:1.2}
.placeholder p{margin:0;opacity:.85;font-size:15px}
#done{background:#fff;color:#111;padding:calc(var(--st) + 120px) 24px calc(var(--sb) + 24px);justify-content:space-between}
#done h2{margin:auto 0 8px;font-size:26px}
#done p{margin:0 0 auto;color:#6b7280;font-size:18px;line-height:1.35}
#done .go{width:100%;border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:600;background:#d1fae5;color:#059669;cursor:pointer}
#done .go:disabled{opacity:.6}
#err{padding:30px;text-align:center;align-items:center;justify-content:center;gap:12px}
#err button{border:0;border-radius:12px;padding:12px 22px;background:var(--accent);color:#06210f;font-weight:700}
</style>
</head>
<body>
<div id="ad" class="screen">
  <div class="bar">
    <div class="tag" id="tag">Реклама</div>
    <div class="tools">
      <button class="btn" id="mute" hidden aria-label="Звук">🔇</button>
      <button class="btn" id="close" aria-label="Закрыть" disabled>
        <svg viewBox="0 0 38 38"><circle class="trk" cx="19" cy="19" r="16"/><circle class="prg" id="prg" cx="19" cy="19" r="16"/></svg>
        <span id="count">5</span>
      </button>
    </div>
  </div>
  <div class="creative" id="creative"></div>
  <div class="shade" id="shade" hidden></div>
  <div class="info" id="info" hidden><h2 id="ttl"></h2><p id="txt"></p></div>
  <div class="hint" id="hint"></div>
  <div class="cta" id="cta" hidden></div>
  <div class="pbar" id="pbar" hidden><i id="pfill"></i></div>
</div>
<div id="done" class="screen">
  <div><h2>Приятного просмотра 🍿</h2><p>Вы получили бесплатный просмотр, жми продолжить 👇</p></div>
  <button class="go" id="go">Продолжить</button>
</div>
<div id="err" class="screen">
  <div style="font-size:42px">⚠</div>
  <div id="errText">Ошибка загрузки</div>
  <button onclick="location.reload()">Повторить</button>
</div>
<script>
(() => {
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
  const $ = id => document.getElementById(id);
  const show = id => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); };
  const token = new URLSearchParams(location.search).get('token') || '';
  const initData = tg ? tg.initData : '';
  async function api(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, initData, ...body }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }
  const fail = msg => { $('errText').textContent = msg; show('err'); };
  const C = 2 * Math.PI * 16, prg = $('prg');
  prg.style.strokeDasharray = C; prg.style.strokeDashoffset = C;
  let finished = false, clickSent = false, timerStarted = false, total = 5;

  function openAd(url) {
    if (!url) return;
    if (!clickSent) { clickSent = true; api('/api/ad/click', {}).catch(() => {}); }
    if (tg && tg.openLink) tg.openLink(url); else window.open(url, '_blank');
  }
  function placeholder(c) {
    const d = document.createElement('div');
    d.className = 'placeholder';
    d.innerHTML = '<div style="font-size:54px">📢</div><h1></h1><p></p>';
    d.querySelector('h1').textContent = c.placeholder_title || 'Здесь могла быть ваша реклама';
    d.querySelector('p').textContent = c.placeholder_text || 'Свяжитесь с администратором для размещения';
    return d;
  }
  function startTimer() {
    if (timerStarted) return;
    timerStarted = true;
    const btn = $('close'), count = $('count'), t0 = performance.now();
    const tick = () => {
      const left = Math.max(0, total - (performance.now() - t0) / 1000);
      count.textContent = Math.ceil(left);
      prg.style.strokeDashoffset = C * (left / total);
      if (left <= 0) {
        btn.disabled = false; btn.classList.add('ready'); count.textContent = '✕'; $('hint').textContent = '';
        return;
      }
      $('hint').textContent = 'Закрыть можно через ' + Math.ceil(left) + ' с';
      requestAnimationFrame(tick);
    };
    tick();
  }
  function mediaVideo(c, box) {
    const bg = document.createElement('video');
    bg.className = 'blur'; bg.src = c.src; bg.muted = true; bg.loop = true; bg.autoplay = true; bg.playsInline = true;
    const v = document.createElement('video');
    v.className = 'fg'; v.src = c.src; v.muted = true; v.autoplay = true; v.playsInline = true; v.loop = !!c.loop;
    v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
    box.classList.add('contain'); box.append(bg, v);
    v.addEventListener('playing', startTimer, { once: true });
    v.addEventListener('error', () => { box.innerHTML = ''; box.appendChild(placeholder(c)); startTimer(); });
    if (!c.loop) {
      $('pbar').hidden = false;
      v.addEventListener('timeupdate', () => { if (v.duration) $('pfill').style.width = (v.currentTime / v.duration * 100) + '%'; });
      const m = $('mute'); m.hidden = false;
      m.onclick = () => { v.muted = !v.muted; bg.muted = true; m.textContent = v.muted ? '🔇' : '🔊'; v.play().catch(() => {}); };
    }
    v.play().catch(() => {});
    setTimeout(startTimer, 3500);
  }
  function render(c) {
    const box = $('creative'); box.innerHTML = '';
    $('tag').textContent = c.label || 'Реклама';
    if (c.kind === 'html' && c.html) {
      const f = document.createElement('iframe');
      f.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms');
      f.srcdoc = c.html; box.appendChild(f); startTimer();
    } else if (c.kind === 'video' && c.src) {
      mediaVideo(c, box);
    } else if (c.kind === 'image' && c.src) {
      const img = document.createElement('img'); img.alt = ''; img.src = c.src;
      img.onload = startTimer;
      img.onerror = () => { box.innerHTML = ''; box.appendChild(placeholder(c)); startTimer(); };
      box.appendChild(img); setTimeout(startTimer, 3500);
    } else { box.appendChild(placeholder(c)); startTimer(); }
    if (c.kind !== 'html') {
      if (c.title || c.text) {
        $('ttl').textContent = c.title || ''; $('txt').textContent = c.text || '';
        $('info').hidden = false; $('shade').hidden = false;
      }
      if (c.link) {
        box.addEventListener('click', () => openAd(c.link));
        const cta = $('cta'); cta.hidden = false; cta.innerHTML = '';
        const b = document.createElement('button'); b.textContent = c.cta_text || 'Подробнее'; b.onclick = () => openAd(c.link);
        cta.appendChild(b);
      }
    }
  }
  $('close').addEventListener('click', async () => {
    const b = $('close');
    if (b.disabled || finished) return;
    finished = true; b.disabled = true;
    try { await api('/api/ad/done', {}); show('done'); }
    catch (e) {
      finished = false; b.disabled = false;
      if (/wait/i.test(e.message)) setTimeout(() => $('close').click(), 1200); else fail(e.message);
    }
  });
  $('go').addEventListener('click', () => { $('go').disabled = true; tg ? tg.close() : window.close(); });
  (async () => {
    if (!token) return fail('Нет токена просмотра');
    try {
      const cfg = await api('/api/ad/config', {});
      total = Math.max(1, Number(cfg.timer) || 5);
      show('ad'); render(cfg);
    } catch (e) { fail(e.message); }
  })();
})();
</script>
</body>
</html>
